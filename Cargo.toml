[package]
name = "hexfetch-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
axum = "0.8.9"
reqwest = { version = "0.12.5", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust-embed = "8.4.0"

[profile.release]
opt-level = "z"           # Optimize strictly for binary size
lto = true                # Link-Time Optimization (crucial for size)
codegen-units = 1         # Slower compile, better optimization
strip = true              # Strip debug symbols
panic = "abort"           # Remove unwind tables (smaller binary)
