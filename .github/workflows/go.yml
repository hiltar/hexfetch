name: hexfetch

on:
  push:
    branches:
      - arm
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26'
        
    - name: Build
      run: |
        go mod init hexfetch || true
        go mod tidy
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -a -trimpath -ldflags="-s -w" -o hexfetch-arm
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -trimpath -ldflags="-s -w" -o hexfetch
        upx --best --lzma hexfetch*

    - name: Upload to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          hexfetch-arm
          hexfetch
          draft: true
