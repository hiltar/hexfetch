[package]
name = "hexfetch-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust-embed = "8.4"

[profile.release]
opt-level = "z"           # Optimize strictly for binary size
lto = "fat"               # Explicit Fat LTO (merges all crates into one optimization unit)
codegen-units = 1         # Slower compile, better optimization
strip = "symbols"         # Explicitly strip all symbols and debug info
panic = "abort"           # Remove unwind tables
debug = false             # Ensure no debug info is generated
