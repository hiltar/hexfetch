name: hexfetch

on:
  push:
    branches: [arm]
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            output: hexfetch-arm
          - goarch: amd64
            output: hexfetch
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
        cache: true

    - name: Build
      run: |
        go mod init hexfetch && go mod tidy
        CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
        go build -trimpath -ldflags="-s -w" -o "${{ matrix.output }}" .

    - name: Generate Checksum
      if: github.event_name == 'release'
      run: sha256sum "${{ matrix.output }}" > "${{ matrix.output }}.sha256"

    - name: Upload to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ matrix.output }}
          ${{ matrix.output }}.sha256
        draft: true
