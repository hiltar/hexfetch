name: hexfetch

on:
  push:
    branches:
      - arm
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Grant write access to repository contents for release uploads
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
        
    - name: Build
      run: |
        go mod init hexfetch-arm
        go get github.com/cenkalti/backoff/v4
        go get github.com/json-iterator/go
        CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -a -ldflags="-s -w" -o hexfetch-arm
        upx --best hexfetch-arm

    - name: Upload hexfetch as artifact
      uses: actions/upload-artifact@v4
      with:
        name: hexfetch-arm
        path: hexfetch-arm
    
    - name: Upload to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: hexfetch-arm
        draft: true
        
