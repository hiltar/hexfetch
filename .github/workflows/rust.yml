name: hextrack

on:
  push:
    branches: [rust]
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            output: hextrack
            os: ubuntu-latest
            binary-path: target/x86_64-unknown-linux-musl/release/hextrack-rs
          - target: aarch64-unknown-linux-musl
            output: hextrack-arm
            os: ubuntu-latest
            binary-path: target/aarch64-unknown-linux-musl/release/hextrack-rs
          - target: armv7-unknown-linux-musleabihf
            output: hextrack-armv7
            os: ubuntu-latest
            binary-path: target/armv7-unknown-linux-musleabihf/release/hextrack-rs
          - target: x86_64-pc-windows-msvc
            output: hextrack.exe
            os: windows-latest
            binary-path: target/release/hextrack-rs.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo zigbuild --release --target ${{ matrix.target }}
          mv ${{ matrix.binary-path }} ${{ matrix.output }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release
          mv ${{ matrix.binary-path }} ${{ matrix.output }}

      - name: Generate Checksum
        if: github.event_name == 'release'
        shell: bash
        run: sha256sum "${{ matrix.output }}" > "${{ matrix.output }}.sha256"

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.output }}
            ${{ matrix.output }}.sha256
          draft: true
