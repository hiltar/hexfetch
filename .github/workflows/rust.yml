name: hexfetch

on:
  push:
    branches: [esp32]
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-esp32:
    name: Build (xtensa-esp32s3-espidf)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HEX_WIFI_SSID: ${{ secrets.ESP_WIFI_SSID || 'hexfetch-ci' }}
      HEX_WIFI_PASS: ${{ secrets.ESP_WIFI_PASS || 'hexfetch-ci' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: esp32

      - name: Install espup + ldproxy
        run: cargo install --locked espup ldproxy

      - name: Cache Xtensa toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/esp*
            ~/.espup
          key: xtensa-esp32s3-v1

      - name: Install Xtensa toolchain
        run: espup install --targets esp32s3

      - name: Export Xtensa environment
        run: |
          set -e
          if [ -f "$HOME/export-esp.sh" ]; then
            . "$HOME/export-esp.sh"
          elif [ -f "${{ github.workspace }}/export-esp.sh" ]; then
            . "${{ github.workspace }}/export-esp.sh"
          else
            echo "::error::export-esp.sh not found"
            exit 1
          fi
          {
            echo "PATH=$PATH"
            echo "LIBCLANG_PATH=$LIBCLANG_PATH"
          } >> "$GITHUB_ENV"

      - name: Install espflash
        run: cargo install --locked espflash

      - name: Build firmware
        working-directory: esp32
        run: cargo build --release

      - name: Merge full flash image
        working-directory: esp32
        run: cargo espflash merge-bin --release --output "${{ github.workspace }}/hexfetch-esp32.bin"

      - name: Generate Checksum
        if: github.event_name == 'release'
        run: sha256sum hexfetch-esp32.bin > hexfetch-esp32.bin.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hexfetch-esp32
          path: |
            hexfetch-esp32.bin
            esp32/target/xtensa-esp32s3-espidf/release/hexfetch-esp32

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hexfetch-esp32.bin
            hexfetch-esp32.bin.sha256
          draft: true
