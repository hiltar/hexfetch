[package]
name = "hexfetch-esp32"
version = "0.4.0"
edition = "2021"

[dependencies]
esp-idf-svc = { version = "0.51", features = ["std", "alloc", "binstart"] }
embedded-svc = { version = "0.28", default-features = false, features = ["std"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rust-embed = { version = "8", features = ["debug-embed"] }

[build-dependencies]
embuild = "=0.32.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = false
