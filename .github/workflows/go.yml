name: hexfetch

on:
  push:
    branches: [rust]
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 AMD64 target (Fully static via musl)
          - target: x86_64-unknown-linux-musl
            output: hexfetch
          # ARM64 target (Fully static via musl)
          - target: aarch64-unknown-linux-musl
            output: hexfetch-arm
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache cargo dependencies
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true

    - name: Install cross
      uses: taiki-e/install-action@cross

    - name: Build
      run: |
        # Build the fully static musl binary using cross
        # 'cross' automatically handles the Docker container and linker setup for the target arch
        cross build --release --target ${{ matrix.target }}
        
        # The binary name generated by Cargo is 'hexfetch-rs' (from Cargo.toml).
        # We rename it to match your original Go workflow output names.
        mv target/${{ matrix.target }}/release/hexfetch-rs ${{ matrix.output }}

    - name: Generate Checksum
      if: github.event_name == 'release'
      run: sha256sum "${{ matrix.output }}" > "${{ matrix.output }}.sha256"

    - name: Upload to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ matrix.output }}
          ${{ matrix.output }}.sha256
        draft: true
