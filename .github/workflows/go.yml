name: hexfetch

on:
  push:
    branches: [arm]
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            output: hexfetch-arm
          - goarch: amd64
            output: hexfetch
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
        cache: true

    - name: Install UPX
      run: |
        UPX_VERSION="5.1.1"
        wget -q "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"
        tar -xf "upx-${UPX_VERSION}-amd64_linux.tar.xz"
        sudo cp "upx-${UPX_VERSION}-amd64_linux/upx" /usr/local/bin/
        rm -rf upx-*
        upx --version

    - name: Build
      run: |
        CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
        go build -trimpath -ldflags="-s -w" -o "${{ matrix.output }}" .

    - name: Compress with UPX
      run: |
        upx --best --lzma "${{ matrix.output }}"
        ls -lh "${{ matrix.output }}"

    - name: Smoke Test (AMD64 only)
      if: matrix.goarch == 'amd64'
      run: |
        ./${{ matrix.output }} --help || ./${{ matrix.output }} -h || ./${{ matrix.output }} version || echo "Binary executes"

    - name: Generate Checksum
      if: github.event_name == 'release'
      run: sha256sum "${{ matrix.output }}" > "${{ matrix.output }}.sha256"

    - name: Upload to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ matrix.output }}
          ${{ matrix.output }}.sha256
        draft: true
